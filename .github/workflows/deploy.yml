name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Les photos déjà produites par Astro (.astro-cache, cf. astro.config.mjs) d'un déploiement à l'autre : seules les nouvelles sont refaites.
      - name: Cache des photos
        uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-${{ hashFiles('design/directions/img/**', 'src/components/ProjectPhoto.astro', 'package-lock.json') }}
          restore-keys: astro-
      # Le cache garde aussi .astro-cache/data-store.json, le Markdown des pages de texte rendu par Astro : il ne se renouvelle que si le fichier Markdown
      # change, pas quand le plugin qui le met en forme change (src/lib/rehype-registre.mjs). Retiré avant chaque construction : les pages sont rendues à neuf.
      - name: Rendu du Markdown à neuf
        run: rm -f .astro-cache/data-store.json
      - name: Install, build, and upload
        uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
