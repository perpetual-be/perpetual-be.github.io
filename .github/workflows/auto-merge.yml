name: Fusion automatique des PR

# Fusionne automatiquement toute PR ouverte depuis une branche de ce dépôt,
# une fois que le site se construit sans erreur.
# Pour garder une PR ouverte, ajouter l'étiquette « no-auto-merge ».

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, unlabeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'no-auto-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Les photos déjà produites par Astro (.astro-cache, cf. astro.config.mjs) d'un build à l'autre : seules les nouvelles versions sont produites.
      # Une clé par run : actions/cache n'enregistre rien quand la clé exacte existe déjà, et l'empreinte (photos, ProjectPhoto.astro, package-lock.json)
      # ne change pas quand une nouvelle page demande d'autres versions des mêmes photos ; avec une clé fixe, ces versions seraient refaites à chaque
      # build, jamais gardées. Chaque run repart du cache le plus récent, quelle que soit son empreinte (elle n'est plus qu'une étiquette) : Astro y
      # ajoute sans rien retirer et nomme chaque version d'après le contenu de sa photo, rien de périmé ne peut en sortir. Le run enregistre ensuite
      # le sien (GitHub évince lui-même les plus anciens au-delà de 10 Go par dépôt).
      - name: Cache des photos
        uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-${{ hashFiles('design/directions/img/**', 'src/components/ProjectPhoto.astro', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: astro-
      # Le cache garde aussi .astro-cache/data-store.json, le Markdown des pages de texte rendu par Astro : il ne se renouvelle que si le fichier Markdown
      # change, pas quand le plugin qui le met en forme change (src/lib/rehype-registre.mjs). Retiré avant chaque construction : les pages sont rendues à neuf.
      - name: Rendu du Markdown à neuf
        run: rm -f .astro-cache/data-store.json

      - name: Vérifier que le site se construit
        run: |
          npm ci
          npm run build

      - name: Fusionner la PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "true" ]; then
            gh pr ready "$PR" --repo "$GITHUB_REPOSITORY"
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch

      # Une fusion faite avec le jeton GITHUB_TOKEN ne déclenche pas le
      # workflow de déploiement (push sur main) : on le lance explicitement.
      - name: Lancer le déploiement
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
